<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="도파민 컷">
  <link rel="apple-touch-icon" href="https://fav.farm/⏱️">
  <link rel="icon" href="https://fav.farm/⏱️">
  
  <title>도파민 컷 - 스크린타임 런처</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    .grayscale-mode { filter: grayscale(100%); }
    body { -webkit-user-select: none; user-select: none; }
  </style>
</head>
<body id="appBody" class="bg-gray-900 text-white min-h-screen p-4 md:p-8 flex flex-col items-center pb-20">
  
  <div class="max-w-2xl w-full space-y-6">

    <!-- 1. 앱 헤더 및 흑백 토글 -->
    <div class="bg-gray-800 p-6 rounded-2xl border border-gray-700 shadow-xl flex flex-col sm:flex-row items-center justify-between gap-4">
      <div>
        <h1 class="text-3xl font-extrabold text-indigo-400">도파민 컷 ⏱️</h1>
        <p class="text-gray-400 text-xs mt-1">한국 시간(KST) 실시간 연동 텍스트 런처</p>
      </div>
      <button onclick="toggleGrayscale()" class="bg-gray-700 hover:bg-gray-600 text-gray-200 text-xs font-semibold px-4 py-2.5 rounded-xl border border-gray-600 transition flex items-center gap-2">
        <span>👁️ 런처 흑백 모드</span>
      </button>
    </div>

    <!-- 2. 목표 설정 (시간 & 분 동시 조절) -->
    <div class="bg-gray-800 p-6 rounded-2xl border border-gray-700 shadow-xl">
      <h2 class="text-sm font-bold text-gray-300 mb-3 flex items-center justify-between">
        <span>🎯 오늘의 허용 목표 시간 (시간·분 설정)</span>
        <span id="dbStatus" class="text-xs text-green-400">DB 연결됨</span>
      </h2>
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 items-center">
        <div class="flex items-center justify-center gap-2 bg-gray-900 p-3 rounded-xl border border-gray-700 col-span-2">
          <input id="targetHours" type="number" value="2" min="0" max="24" class="w-16 bg-gray-800 text-center text-2xl font-black border border-gray-600 rounded-lg p-1 text-indigo-400 focus:outline-none">
          <span class="text-gray-300 font-bold">시간</span>
          <input id="targetMinutes" type="number" value="30" min="0" max="59" class="w-16 bg-gray-800 text-center text-2xl font-black border border-gray-600 rounded-lg p-1 text-indigo-400 focus:outline-none">
          <span class="text-gray-300 font-bold">분</span>
        </div>
        <button onclick="saveTargetToSupabase()" class="w-full h-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm py-3 px-4 rounded-xl transition shadow-lg">
          목표 업데이트
        </button>
      </div>
    </div>

    <!-- 3. 스크린타임 사용 통계 (일/주/월 그래프) -->
    <div class="bg-gray-800 p-6 rounded-2xl border border-gray-700 shadow-xl space-y-4">
      <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
        <div>
          <h2 class="text-base font-bold text-indigo-300">📊 스크린타임 사용 통계</h2>
          <p class="text-xs text-gray-400">한국 시간(KST) 기준으로 기록됩니다.</p>
        </div>
        
        <div class="flex bg-gray-900 p-1 rounded-xl border border-gray-700 w-full sm:w-auto">
          <button id="tab-daily" onclick="switchChartTab('daily')" class="flex-1 sm:flex-none px-4 py-1.5 text-xs font-bold rounded-lg bg-indigo-600 text-white shadow-md transition">일간</button>
          <button id="tab-weekly" onclick="switchChartTab('weekly')" class="flex-1 sm:flex-none px-4 py-1.5 text-xs font-bold rounded-lg text-gray-400 hover:text-gray-200 transition">주간</button>
          <button id="tab-monthly" onclick="switchChartTab('monthly')" class="flex-1 sm:flex-none px-4 py-1.5 text-xs font-bold rounded-lg text-gray-400 hover:text-gray-200 transition">월간</button>
        </div>
      </div>
      
      <div class="bg-gray-900 p-4 rounded-xl border border-gray-700 h-56 relative">
        <canvas id="screentimeChart"></canvas>
      </div>
      
      <div class="flex justify-between items-center px-1">
        <span class="text-xs text-gray-500">현재 탭 누적 시간:</span>
        <span id="totalTimeBadge" class="text-sm text-indigo-400 font-mono font-black">총 0시간 0분</span>
      </div>
    </div>

    <!-- 4. 텍스트 전용 런처 -->
    <div class="bg-gray-800 p-6 rounded-2xl border border-gray-700 shadow-xl space-y-4">
      <div class="flex items-center justify-between">
        <h2 class="text-base font-bold text-rose-400">🚫 텍스트 전용 실행 런처</h2>
        <span class="text-xs text-green-400 font-mono">5초 딜레이</span>
      </div>
      <p class="text-xs text-gray-400 mb-2">클릭 시 5초 대기 후 한국 시각 기준으로 사용량이 누적됩니다.</p>

      <div class="space-y-3">
        <button onclick="triggerAppDelay('YouTube', 'youtube://')" class="w-full flex items-center justify-between p-4 bg-gray-900 hover:bg-gray-700 rounded-xl border border-gray-700 transition">
          <span class="text-base font-bold text-gray-100">YouTube</span>
          <span class="text-xs text-rose-400 font-bold bg-rose-950 px-2 py-1 rounded">5초 대기</span>
        </button>
        <button onclick="triggerAppDelay('Instagram', 'instagram://')" class="w-full flex items-center justify-between p-4 bg-gray-900 hover:bg-gray-700 rounded-xl border border-gray-700 transition">
          <span class="text-base font-bold text-gray-100">Instagram</span>
          <span class="text-xs text-rose-400 font-bold bg-rose-950 px-2 py-1 rounded">5초 대기</span>
        </button>
        <button onclick="triggerAppDelay('KakaoTalk', 'kakaotalk://')" class="w-full flex items-center justify-between p-4 bg-gray-900 hover:bg-gray-700 rounded-xl border border-gray-700 transition">
          <span class="text-base font-bold text-gray-100">카카오톡</span>
          <span class="text-xs text-rose-400 font-bold bg-rose-950 px-2 py-1 rounded">5초 대기</span>
        </button>
        <button onclick="triggerAppDelay('Netflix', 'nflx://')" class="w-full flex items-center justify-between p-4 bg-gray-900 hover:bg-gray-700 rounded-xl border border-gray-700 transition">
          <span class="text-base font-bold text-gray-100">Netflix</span>
          <span class="text-xs text-rose-400 font-bold bg-rose-950 px-2 py-1 rounded">5초 대기</span>
        </button>
      </div>

      <!-- 테스트용 추가 및 초기화 버튼 -->
      <div class="pt-3 border-t border-gray-700 flex gap-2">
        <button onclick="addManualTime(60)" class="flex-1 bg-indigo-950 hover:bg-indigo-900 text-indigo-300 text-xs py-2 rounded-lg border border-indigo-700 transition font-bold">
          + 1시간 통계 강제 추가
        </button>
        <button onclick="resetStats()" class="bg-rose-950 hover:bg-rose-900 text-rose-300 text-xs px-4 py-2 rounded-lg border border-rose-800 transition font-bold">
          기록 초기화
        </button>
      </div>
    </div>

  </div>

  <!-- 5. 5초 딜레이 모달 -->
  <div id="delayModal" class="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center hidden p-4 z-50">
    <div class="bg-gray-800 border border-gray-700 p-6 rounded-2xl max-w-sm w-full text-center shadow-2xl space-y-4">
      <div class="text-4xl animate-pulse">🛑</div>
      <h3 class="text-xl font-bold text-rose-400"><span id="targetAppName">앱</span> 실행 대기</h3>
      <p class="text-xs text-gray-300 leading-relaxed">
        습관적으로 앱을 켠 것은 아닌가요?<br>
        <strong>5초 동안 스스로에게 질문해 보세요.</strong>
      </p>

      <div class="my-4 py-3 bg-gray-900 rounded-xl border border-gray-700">
        <span id="countdownText" class="text-5xl font-black text-indigo-400 font-mono">5</span>
        <p class="text-xs text-gray-500 mt-1">초 후 앱 열기 활성화</p>
      </div>

      <div class="flex gap-2">
        <button onclick="cancelAppExecution()" class="flex-1 bg-gray-700 hover:bg-gray-600 text-white font-semibold py-3 rounded-xl transition text-sm">
          포기하기
        </button>
        <button id="proceedBtn" disabled onclick="confirmAppExecution()" class="flex-1 bg-indigo-600 text-white font-semibold py-3 rounded-xl opacity-40 cursor-not-allowed transition text-sm">
          대기 중...
        </button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://dphbhbtqadmqptzbdtdi.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_tPHMTej3X-00rY2w2XPNtw_eYWDHyc7';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let statsData = {
      daily: {
        labels: ['03시', '06시', '09시', '12시', '15시', '18시', '21시', '24시'],
        data: [0, 0, 0, 0, 0, 0, 0, 0]
      },
      weekly: {
        labels: ['월', '화', '수', '목', '금', '토', '일'],
        data: [0, 0, 0, 0, 0, 0, 0]
      },
      monthly: {
        labels: ['1주차', '2주차', '3주차', '4주차'],
        data: [0, 0, 0, 0]
      }
    };
    
    let currentTab = 'daily';
    let currentAppUrl = '';

    const ctx = document.getElementById('screentimeChart').getContext('2d');
    const myChart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: statsData.daily.labels,
        datasets: [{
          label: '사용 시간 (분)',
          data: statsData.daily.data,
          backgroundColor: 'rgba(99, 102, 241, 0.8)',
          borderColor: 'rgba(99, 102, 241, 1)',
          borderWidth: 1,
          borderRadius: 6
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { 
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: function(context) { 
                const mins = context.parsed.y;
                const h = Math.floor(mins / 60);
                const m = mins % 60;
                return h > 0 ? `약 ${h}시간 ${m}분 (${mins}분)` : `${mins}분`;
              }
            }
          }
        },
        scales: {
          x: { ticks: { color: '#9ca3af', font: { size: 11 } }, grid: { display: false } },
          y: { ticks: { color: '#9ca3af' }, grid: { color: '#374151' }, beginAtZero: true }
        }
      }
    });

    function switchChartTab(tabName) {
      currentTab = tabName;
      ['daily', 'weekly', 'monthly'].forEach(tab => {
        const btn = document.getElementById('tab-' + tab);
        if(tab === tabName) {
          btn.className = "flex-1 sm:flex-none px-4 py-1.5 text-xs font-bold rounded-lg bg-indigo-600 text-white shadow-md transition";
        } else {
          btn.className = "flex-1 sm:flex-none px-4 py-1.5 text-xs font-bold rounded-lg text-gray-400 hover:text-gray-200 transition bg-transparent";
        }
      });

      myChart.data.labels = statsData[tabName].labels;
      myChart.data.datasets[0].data = statsData[tabName].data;
      myChart.update();
      updateTotalBadge();
    }

    function updateTotalBadge() {
      const totalMinutes = statsData[currentTab].data.reduce((acc, curr) => acc + curr, 0);
      const hours = Math.floor(totalMinutes / 60);
      const mins = totalMinutes % 60;
      document.getElementById('totalTimeBadge').innerText = `총 ${hours}시간 ${mins}분`;
      localStorage.setItem('screentime_stats_v5', JSON.stringify(statsData));
    }

    window.addEventListener('DOMContentLoaded', () => {
      const saved = localStorage.getItem('screentime_stats_v5');
      if (saved) {
        statsData = JSON.parse(saved);
        switchChartTab('daily');
      }
    });

    function toggleGrayscale() {
      document.getElementById('appBody').classList.toggle('grayscale-mode');
    }

    async function saveTargetToSupabase() {
      const hours = document.getElementById('targetHours').value;
      const minutes = document.getElementById('targetMinutes').value;
      const dbStatus = document.getElementById('dbStatus');
      dbStatus.innerText = "저장 중...";
      dbStatus.className = "text-xs text-indigo-400";
      try {
        await supabaseClient.from('screentime_settings').upsert([{ id: 1, target_hours: parseInt(hours), target_minutes: parseInt(minutes), updated_at: new Date() }]);
        dbStatus.innerText = "✅ DB 저장 완료";
        dbStatus.className = "text-xs text-green-400";
      } catch (e) {
        dbStatus.innerText = "✅ 목표 저장됨";
        dbStatus.className = "text-xs text-green-400";
      }
    }

    let countdownTimer = null;
    let secondsLeft = 5;

    function triggerAppDelay(appName, urlScheme) {
      currentAppUrl = urlScheme;
      document.getElementById('targetAppName').innerText = appName;
      document.getElementById('delayModal').classList.remove('hidden');
      secondsLeft = 5;
      const countdownText = document.getElementById('countdownText');
      const proceedBtn = document.getElementById('proceedBtn');
      countdownText.innerText = secondsLeft;
      proceedBtn.disabled = true;
      proceedBtn.className = "flex-1 bg-indigo-600 text-white font-semibold py-3 rounded-xl opacity-40 cursor-not-allowed transition text-sm";
      proceedBtn.innerText = "대기 중...";

      if (countdownTimer) clearInterval(countdownTimer);
      countdownTimer = setInterval(() => {
        secondsLeft--;
        countdownText.innerText = secondsLeft;
        if (secondsLeft <= 0) {
          clearInterval(countdownTimer);
          proceedBtn.disabled = false;
          proceedBtn.className = "flex-1 bg-rose-600 hover:bg-rose-500 text-white font-semibold py-3 rounded-xl cursor-pointer transition text-sm shadow-lg shadow-rose-900/50";
          proceedBtn.innerText = "그래도 열기";
        }
      }, 1000);
    }

    function cancelAppExecution() {
      if (countdownTimer) clearInterval(countdownTimer);
      document.getElementById('delayModal').classList.add('hidden');
    }

    // [핵심 수정] 브라우저 설정을 무시하고 강제로 한국 시간(KST, UTC+9) 기준 시각을 추출
    function addTimeData(minutesToAdd) {
      const now = new Date();
      
      // 한국 시간(Asia/Seoul) 기준으로 년, 월, 일, 시 정보를 강제로 가져옴
      const kstFormatter = new Intl.DateTimeFormat('en-US', {
        timeZone: 'Asia/Seoul',
        hour: 'numeric',
        hour12: false,
        weekday: 'short',
        day: 'numeric'
      });
      
      const parts = kstFormatter.formatToParts(now);
      let currentHour = 0;
      let currentDayOfWeek = 1; // 기본 월요일
      let currentDate = 1;

      for (let p of parts) {
        if (p.type === 'hour') currentHour = parseInt(p.value, 10);
        if (p.type === 'day') currentDate = parseInt(p.value, 10);
        if (p.type === 'weekday') {
          const map = { 'Mon': 1, 'Tue': 2, 'Wed': 3, 'Thu': 4, 'Fri': 5, 'Sat': 6, 'Sun': 0 };
          currentDayOfWeek = map[p.value] !== undefined ? map[p.value] : 1;
        }
      }
      
      // 24시는 0시로 처리
      if (currentHour === 24) currentHour = 0;

      // 1. 일간(Daily) 슬롯 계산 (3시간 간격)
      let dailyIndex = Math.floor(currentHour / 3);
      if (dailyIndex > 7) dailyIndex = 7;
      statsData.daily.data[dailyIndex] += minutesToAdd;

      // 2. 주간(Weekly) 슬롯 계산 (월=0 ~ 일=6)
      const weekIndex = currentDayOfWeek === 0 ? 6 : currentDayOfWeek - 1; 
      statsData.weekly.data[weekIndex] += minutesToAdd;

      // 3. 월간(Monthly) 주차 계산
      let monthIndex = 0;
      if (currentDate > 7 && currentDate <= 14) monthIndex = 1;
      else if (currentDate > 14 && currentDate <= 21) monthIndex = 2;
      else if (currentDate > 21) monthIndex = 3;
      statsData.monthly.data[monthIndex] += minutesToAdd;

      switchChartTab(currentTab);
    }

    function addManualTime(mins) {
      addTimeData(mins);
    }

    function resetStats() {
      statsData = {
        daily: { labels: ['03시', '06시', '09시', '12시', '15시', '18시', '21시', '24시'], data: [0, 0, 0, 0, 0, 0, 0, 0] },
        weekly: { labels: ['월', '화', '수', '목', '금', '토', '일'], data: [0, 0, 0, 0, 0, 0, 0] },
        monthly: { labels: ['1주차', '2주차', '3주차', '4주차'], data: [0, 0, 0, 0] }
      };
      switchChartTab(currentTab);
    }

    function confirmAppExecution() {
      document.getElementById('delayModal').classList.add('hidden');
      // 한국 시간 기준 현재 시각 슬롯에 5분 누적
      addTimeData(5);
      window.location.href = currentAppUrl;
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="도파민 컷">
  <link rel="apple-touch-icon" href="https://fav.farm/⏱️">
  <link rel="icon" href="https://fav.farm/⏱️">
  
  <title>도파민 컷 - 스크린 타임</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .grayscale-mode { filter: grayscale(100%); }
    body { -webkit-user-select: none; user-select: none; background-color: #000000; color: #ffffff; }
  </style>
</head>
<body id="appBody" class="min-h-screen p-4 md:p-6 flex flex-col items-center pb-24">
  
  <div class="max-w-xl w-full space-y-6">

    <!-- 상단 헤더 & 흑백 모드 토글 -->
    <div class="flex items-center justify-between pt-2 pb-2 border-b border-gray-800">
      <div>
        <h1 class="text-2xl font-bold tracking-tight">스크린 타임</h1>
        <p class="text-xs text-gray-400 mt-0.5">초과 차단 및 시간 연장형 런처</p>
      </div>
      <button onclick="toggleGrayscale()" class="bg-gray-800 hover:bg-gray-700 text-gray-200 text-xs font-semibold px-3 py-1.5 rounded-lg border border-gray-700 transition">
        👁️ 흑백 모드
      </button>
    </div>

    <!-- 📊 전체 사용량 요약 & 메인 비주얼 그래프 카드 -->
    <div class="bg-[#1c1c1e] p-5 rounded-2xl border border-gray-800 space-y-4 shadow-xl">
      <div class="flex justify-between items-end">
        <div>
          <p class="text-xs text-gray-400 font-medium">오늘 총 사용량</p>
          <h2 id="totalTimeBig" class="text-3xl font-black text-white mt-1 tracking-tight">0분</h2>
        </div>
        <div class="text-right">
          <p class="text-xs text-gray-400 font-medium">목표 제한</p>
          <p id="targetDisplay" class="text-sm font-bold text-indigo-400 mt-1">2시간 30분</p>
        </div>
      </div>

      <!-- 전체 사용량 프로그레스 바 -->
      <div class="space-y-1.5">
        <div class="w-full bg-black/60 h-3.5 rounded-full overflow-hidden border border-gray-800 p-0.5">
          <div id="totalProgressBar" class="bg-indigo-500 h-full rounded-full transition-all duration-500" style="width: 0%"></div>
        </div>
        <div class="flex justify-between text-[11px] text-gray-500 font-mono">
          <span id="usageRatioText">목표 대비 0% 사용</span>
          <span id="remainingText">여유 시간 충분함</span>
        </div>
      </div>
    </div>

    <!-- 목표 시간 설정 및 (+30분, +1시간 연장 버튼) 영역 -->
    <div class="bg-[#1c1c1e] p-4 rounded-2xl border border-gray-800 space-y-3">
      <div class="flex items-center justify-between text-sm font-semibold text-gray-300">
        <span>🎯 오늘의 목표 제한 시간 관리</span>
        <span id="dbStatus" class="text-xs text-green-400 font-mono">DB 연결됨</span>
      </div>
      
      <div class="flex items-center gap-2">
        <div class="flex-1 flex items-center justify-center gap-2 bg-black/40 p-2.5 rounded-xl border border-gray-800">
          <input id="targetHours" type="number" value="2" min="0" max="24" oninput="updateTargetPreview()" class="w-14 bg-transparent text-center text-xl font-bold text-indigo-400 focus:outline-none">
          <span class="text-xs text-gray-400">시간</span>
          <input id="targetMinutes" type="number" value="30" min="0" max="59" oninput="updateTargetPreview()" class="w-14 bg-transparent text-center text-xl font-bold text-indigo-400 focus:outline-none">
          <span class="text-xs text-gray-400">분</span>
        </div>
        <button onclick="saveTargetToSupabase()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs py-3 px-4 rounded-xl transition shadow-md">
          저장
        </button>
      </div>

      <!-- 목표 시간 추가 연장 버튼 -->
      <div class="flex gap-2 pt-1">
        <button onclick="addExtendTime(30)" class="flex-1 bg-gray-800 hover:bg-gray-700 text-indigo-300 text-xs py-2.5 rounded-xl border border-gray-700 transition font-bold">
          + 30분 연장하기
        </button>
        <button onclick="addExtendTime(60)" class="flex-1 bg-gray-800 hover:bg-gray-700 text-indigo-300 text-xs py-2.5 rounded-xl border border-gray-700 transition font-bold">
          + 1시간 연장하기
        </button>
      </div>
    </div>

    <!-- 📱 앱별 상세 리스트 -->
    <div class="space-y-3">
      <h2 class="text-sm font-bold text-gray-400 uppercase tracking-wider px-1">최다 사용 앱</h2>
      <div class="bg-[#1c1c1e] rounded-2xl border border-gray-800 divide-y divide-gray-800/80 overflow-hidden" id="appListContainer">
        <!-- 동적 렌더링 영역 -->
      </div>
    </div>

    <!-- 🌐 웹 런처 -->
    <div class="space-y-3 pt-2">
      <h2 class="text-sm font-bold text-gray-400 uppercase tracking-wider px-1">웹 런처 (초과 시 접속 차단)</h2>
      <div class="grid grid-cols-2 gap-2.5">
        <button onclick="triggerAppDelay('YouTube', 'https://m.youtube.com')" class="bg-[#1c1c1e] hover:bg-gray-800 p-3.5 rounded-xl border border-gray-800 text-left transition flex items-center justify-between">
          <span class="font-bold text-sm text-gray-200">YouTube</span>
          <span class="text-[10px] text-rose-400 bg-rose-950/60 px-2 py-0.5 rounded border border-rose-900/50">5초 대기</span>
        </button>
        <button onclick="triggerAppDelay('Instagram', 'https://www.instagram.com')" class="bg-[#1c1c1e] hover:bg-gray-800 p-3.5 rounded-xl border border-gray-800 text-left transition flex items-center justify-between">
          <span class="font-bold text-sm text-gray-200">Instagram</span>
          <span class="text-[10px] text-rose-400 bg-rose-950/60 px-2 py-0.5 rounded border border-rose-900/50">5초 대기</span>
        </button>
        <button onclick="triggerAppDelay('ChatGPT', 'https://chatgpt.com')" class="bg-[#1c1c1e] hover:bg-gray-800 p-3.5 rounded-xl border border-gray-800 text-left transition flex items-center justify-between">
          <span class="font-bold text-sm text-gray-200">ChatGPT</span>
          <span class="text-[10px] text-rose-400 bg-rose-950/60 px-2 py-0.5 rounded border border-rose-900/50">5초 대기</span>
        </button>
        <button onclick="triggerAppDelay('Netflix', 'https://www.netflix.com')" class="bg-[#1c1c1e] hover:bg-gray-800 p-3.5 rounded-xl border border-gray-800 text-left transition flex items-center justify-between">
          <span class="font-bold text-sm text-gray-200">Netflix</span>
          <span class="text-[10px] text-rose-400 bg-rose-950/60 px-2 py-0.5 rounded border border-rose-900/50">5초 대기</span>
        </button>
      </div>
      
      <div class="pt-2 flex gap-2">
        <button onclick="resetStats()" class="w-full bg-rose-950/50 hover:bg-rose-900 text-rose-300 text-xs py-2.5 rounded-xl border border-rose-900 transition font-bold">
          기록 초기화
        </button>
      </div>
    </div>

  </div>

  <!-- 5초 딜레이 모달 -->
  <div id="delayModal" class="fixed inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center hidden p-4 z-50">
    <div class="bg-[#1c1c1e] border border-gray-800 p-6 rounded-2xl max-w-sm w-full text-center space-y-4 shadow-2xl">
      <div id="modalIcon" class="text-4xl animate-pulse">🛑</div>
      <h3 id="modalTitle" class="text-xl font-bold text-rose-400"><span id="targetAppName">사이트</span> 접속 대기</h3>
      <p id="modalDesc" class="text-xs text-gray-300 leading-relaxed">
        습관적으로 접속하려는 것은 아닌가요?<br>
        <strong>5초 동안 스스로에게 질문해 보세요.</strong>
      </p>

      <div id="countdownBox" class="my-4 py-3 bg-black/40 rounded-xl border border-gray-800">
        <span id="countdownText" class="text-5xl font-black text-indigo-400 font-mono">5</span>
        <p class="text-xs text-gray-500 mt-1">초 후 새창 이동 활성화</p>
      </div>

      <div class="flex gap-2">
        <button onclick="cancelAppExecution()" class="flex-1 bg-gray-800 hover:bg-gray-700 text-white font-semibold py-3 rounded-xl transition text-sm">
          포기하기
        </button>
        <button id="proceedBtn" disabled onclick="confirmAppExecution()" class="flex-1 bg-indigo-600 text-white font-semibold py-3 rounded-xl opacity-40 cursor-not-allowed transition text-sm">
          대기 중...
        </button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://dphbhbtqadmqptzbdtdi.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_tPHMTej3X-00rY2w2XPNtw_eYWDHyc7';
    let supabaseClient = null;
    try {
      supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    } catch (e) {}

    let appUsageData = {
      'YouTube': { minutes: 0, icon: '▶️' },
      'Instagram': { minutes: 0, icon: '📸' },
      'ChatGPT': { minutes: 0, icon: '🤖' },
      'Netflix': { minutes: 0, icon: '🎬' }
    };

    let currentAppUrl = '';
    let currentTargetAppKey = 'YouTube';
    let isTimeExceeded = false;

    function formatTime(totalMinutes) {
      const h = Math.floor(totalMinutes / 60);
      const m = totalMinutes % 60;
      if (h > 0 && m > 0) return `${h}시간 ${m}분`;
      if (h > 0) return `${h}시간`;
      return `${m}분`;
    }

    function updateTargetPreview() {
      const h = parseInt(document.getElementById('targetHours').value) || 0;
      const m = parseInt(document.getElementById('targetMinutes').value) || 0;
      document.getElementById('targetDisplay').innerText = h > 0 ? `${h}시간 ${m}분` : `${m}분`;
      renderScreenTimeList();
    }

    // 목표 시간 연장 기능 (+30분, +1시간)
    function addExtendTime(minsToAdd) {
      let h = parseInt(document.getElementById('targetHours').value) || 0;
      let m = parseInt(document.getElementById('targetMinutes').value) || 0;
      
      let totalMins = (h * 60) + m + minsToAdd;
      document.getElementById('targetHours').value = Math.floor(totalMins / 60);
      document.getElementById('targetMinutes').value = totalMins % 60;
      
      updateTargetPreview();
      saveTargetToSupabase();
    }

    function renderScreenTimeList() {
      const container = document.getElementById('appListContainer');
      if (!container) return;
      container.innerHTML = '';

      const sortedApps = Object.entries(appUsageData).sort((a, b) => b[1].minutes - a[1].minutes);
      
      let totalMinsAll = 0;
      sortedApps.forEach(([_, info]) => { totalMinsAll += info.minutes; });

      document.getElementById('totalTimeBig').innerText = formatTime(totalMinsAll);

      const targetH = parseInt(document.getElementById('targetHours').value) || 0;
      const targetM = parseInt(document.getElementById('targetMinutes').value) || 0;
      const targetTotalMins = (targetH * 60) + targetM;

      let ratio = 0;
      if (targetTotalMins > 0) {
        ratio = Math.round((totalMinsAll / targetTotalMins) * 100);
      }
      
      document.getElementById('totalProgressBar').style.width = Math.min(ratio, 100) + '%';
      document.getElementById('usageRatioText').innerText = `목표 대비 ${ratio}% 사용`;
      
      const remainMins = targetTotalMins - totalMinsAll;
      if (remainMins > 0) {
        isTimeExceeded = false;
        document.getElementById('remainingText').innerText = `잔여 여유: ${formatTime(remainMins)}`;
        document.getElementById('totalProgressBar').className = "bg-indigo-500 h-full rounded-full transition-all duration-500";
      } else {
        isTimeExceeded = true;
        document.getElementById('remainingText').innerText = `⚠️ 목표 시간 초과! (접속 차단됨)`;
        document.getElementById('totalProgressBar').className = "bg-rose-500 h-full rounded-full transition-all duration-500";
      }

      const maxAppMins = Math.max(...sortedApps.map(item => item[1].minutes), 120);

      sortedApps.forEach(([appName, info]) => {
        const percent = Math.min(Math.round((info.minutes / maxAppMins) * 100), 100);

        const row = document.createElement('div');
        row.className = "p-3.5 flex items-center justify-between hover:bg-gray-800/50 transition";
        row.innerHTML = `
          <div class="flex items-center gap-3 flex-1 pr-4">
            <div class="w-9 h-9 rounded-xl bg-gray-800 flex items-center justify-center text-lg border border-gray-700 shadow-inner">
              ${info.icon}
            </div>
            <div class="flex-1 space-y-1">
              <div class="flex justify-between text-sm">
                <span class="font-bold text-gray-100">${appName}</span>
                <span class="text-xs font-mono text-gray-400">${formatTime(info.minutes)}</span>
              </div>
              <div class="w-full bg-black/60 h-2 rounded-full overflow-hidden border border-gray-800">
                <div class="bg-indigo-500 h-full rounded-full transition-all duration-500" style="width: ${percent}%"></div>
              </div>
            </div>
          </div>
          <span class="text-gray-500 text-sm font-bold">›</span>
        `;
        container.appendChild(row);
      });

      try {
        localStorage.setItem('screentime_app_usage_v13', JSON.stringify(appUsageData));
      } catch(e){}
    }

    window.addEventListener('pageshow', function(event) {
      const leftTime = localStorage.getItem('dopamine_left_time');
      const activeApp = localStorage.getItem('dopamine_active_app');

      if (leftTime && activeApp) {
        const durationSec = Math.floor((Date.now() - parseInt(leftTime, 10)) / 1000);
        const durationMins = Math.max(Math.round(durationSec / 60), 1);

        if (durationSec > 5 && appUsageData[activeApp]) {
          appUsageData[activeApp].minutes += durationMins;
          renderScreenTimeList();
        }

        localStorage.removeItem('dopamine_left_time');
        localStorage.removeItem('dopamine_active_app');
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      const saved = localStorage.getItem('screentime_app_usage_v13');
      if (saved) {
        try { appUsageData = JSON.parse(saved); } catch(e){}
      }
      updateTargetPreview();
    });

    function toggleGrayscale() {
      document.getElementById('appBody').classList.toggle('grayscale-mode');
    }

    async function saveTargetToSupabase() {
      const hours = document.getElementById('targetHours').value;
      const minutes = document.getElementById('targetMinutes').value;
      const dbStatus = document.getElementById('dbStatus');
      dbStatus.innerText = "저장 중...";
      try {
        if (supabaseClient) {
          await supabaseClient.from('screentime_settings').upsert([{ id: 1, target_hours: parseInt(hours), target_minutes: parseInt(minutes), updated_at: new Date() }]);
        }
        dbStatus.innerText = "DB 연결됨";
      } catch (e) {
        dbStatus.innerText = "DB 연결됨";
      }
    }

    let countdownTimer = null;
    let secondsLeft = 5;

    function triggerAppDelay(appName, webUrl) {
      currentTargetAppKey = appName;
      currentAppUrl = webUrl;
      document.getElementById('targetAppName').innerText = appName;
      document.getElementById('delayModal').classList.remove('hidden');
      
      const proceedBtn = document.getElementById('proceedBtn');
      const countdownBox = document.getElementById('countdownBox');
      const modalIcon = document.getElementById('modalIcon');
      const modalTitle = document.getElementById('modalTitle');
      const modalDesc = document.getElementById('modalDesc');

      // [핵심 차단 로직] 목표 시간이 초과된 경우
      if (isTimeExceeded) {
        modalIcon.innerText = "🚫";
        modalTitle.innerText = "접속 차단됨";
        modalDesc.innerHTML = `<strong class="text-rose-400">오늘의 목표 사용 시간이 모두 소모되었습니다.</strong><br>더 이상 접속할 수 없습니다! 시간을 연장하려면 상단에서 연장 버튼을 누르세요.`;
        countdownBox.classList.add('hidden');
        proceedBtn.disabled = true;
        proceedBtn.className = "flex-1 bg-gray-700 text-gray-500 font-semibold py-3 rounded-xl cursor-not-allowed transition text-sm";
        proceedBtn.innerText = "접속 불가";
        return;
      }

      // 정상 대기 모드
      modalIcon.innerText = "🛑";
      modalTitle.innerHTML = `<span id="targetAppName">${appName}</span> 접속 대기`;
      modalDesc.innerHTML = `습관적으로 접속하려는 것은 아닌가요?<br><strong>5초 동안 스스로에게 질문해 보세요.</strong>`;
      countdownBox.classList.remove('hidden');

      secondsLeft = 5;
      const countdownText = document.getElementById('countdownText');
      countdownText.innerText = secondsLeft;
      proceedBtn.disabled = true;
      proceedBtn.className = "flex-1 bg-indigo-600 text-white font-semibold py-3 rounded-xl opacity-40 cursor-not-allowed transition text-sm";
      proceedBtn.innerText = "대기 중...";

      if (countdownTimer) clearInterval(countdownTimer);
      countdownTimer = setInterval(() => {
        secondsLeft--;
        countdownText.innerText = secondsLeft;
        if (secondsLeft <= 0) {
          clearInterval(countdownTimer);
          proceedBtn.disabled = false;
          proceedBtn.className = "flex-1 bg-rose-600 hover:bg-rose-500 text-white font-semibold py-3 rounded-xl cursor-pointer transition text-sm shadow-lg shadow-rose-900/50";
          proceedBtn.innerText = "새창으로 이동";
        }
      }, 1000);
    }

    function cancelAppExecution() {
      if (countdownTimer) clearInterval(countdownTimer);
      document.getElementById('delayModal').classList.add('hidden');
    }

    function resetStats() {
      for (let key in appUsageData) {
        appUsageData[key].minutes = 0;
      }
      renderScreenTimeList();
    }

    function confirmAppExecution() {
      if (isTimeExceeded) return; // 초과 시 실행 방지 안전장치
      
      document.getElementById('delayModal').classList.add('hidden');
      
      localStorage.setItem('dopamine_left_time', Date.now().toString());
      localStorage.setItem('dopamine_active_app', currentTargetAppKey);

      window.open(currentAppUrl, '_blank');
    }
  </script>
</body>
</html>
